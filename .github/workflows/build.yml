name: Build TVBox APK

# 定时巡检私有仓库 baoxin/TVBox-Next：发现「还没有 release 的 v* tag」就构建
# release + debug APK，并回发到私有仓库该 tag 的 release。
# 构建消耗本公共仓库的免费 Actions 额度，私有仓库不产生用量。
#
# 手动运行：填 tag 强制重建该 tag（release 资产同名覆盖）；
# 不填则构建私有仓库默认分支、只产出 artifact（公共仓库 artifact 任何人可下载）。
#
# 需要 secret PRIVATE_REPO_TOKEN：baoxin 账号的 fine-grained PAT，
# 仅授权 baoxin/TVBox-Next，权限 Contents: Read and write。
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: '强制构建的 tag（如 v2.0.14），留空则构建默认分支'
        required: false
        default: ''

jobs:
  find:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.find.outputs.tag }}
      ref: ${{ steps.find.outputs.ref }}
    steps:
      - name: Find tag without release
        id: find
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::尚未配置 PRIVATE_REPO_TOKEN，跳过巡检"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "ref=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "ref=refs/tags/$INPUT_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for tag in $(gh api "/repos/baoxin/TVBox-Next/tags?per_page=30" --jq '.[].name'); do
            if ! gh api "/repos/baoxin/TVBox-Next/releases/tags/$tag" > /dev/null 2>&1; then
              echo "发现未发布 release 的 tag：$tag"
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "没有待构建的新 tag"
          echo "tag=" >> "$GITHUB_OUTPUT"
          echo "ref=" >> "$GITHUB_OUTPUT"

  build:
    needs: find
    if: needs.find.outputs.tag != '' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: baoxin/TVBox-Next
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ needs.find.outputs.ref }}

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build release + debug APK
        working-directory: TVBox-Next
        run: sh gradlew :app:assembleRelease :app:assembleDebug --no-daemon

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp TVBox-Next/app/build/outputs/apk/java/release/*.apk dist/TVBox-release.apk
          cp TVBox-Next/app/build/outputs/apk/java/debug/*.apk dist/TVBox-debug.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach APKs to private release
        if: needs.find.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: baoxin/TVBox-Next
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          tag_name: ${{ needs.find.outputs.tag }}
          files: dist/*.apk
          generate_release_notes: true
